<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Review</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="header-nav">
        <header>
            <a href="index.html"><img src="images/logo.png" class="logo" alt="Logo"></a>
        </header>
        <nav>
            <div id="nav-a-link">
                <a href="login.html" id="login-link">Login</a>
                <a href="index.html" id="index-link">Available Places</a>
                <a href="place.html" id="place-link">Place Details</a>
                <a href="add_review.html" id="add-review-link">Add a Review</a>
            </div>
        </nav>
    </div>
    <main>
        <!-- Add something to identify the place you're reviewing -->
        <section id="add-review">
            <div class="add-review">
                <h2>Add a Review</h2>
                <form id="review-form">
                    <div>
                        <label for="review-text" class="review-label">Review:</label>
                        <textarea id="review-text" name="review-text" required></textarea>
                    </div>
                    <div>
                    <label for="rating-range" class="rating-label">Rating:</label>
                        <span id="review-rating-stars-submit">
                            <svg class="star" data-value="1" viewBox="0 0 24 24">
                                <polygon points="12,2 15,9 22,9 17,14 19,21 12,17 5,21 7,14 2,9 9,9" />
                            </svg>
                            <svg class="star" data-value="2" viewBox="0 0 24 24">
                                <polygon points="12,2 15,9 22,9 17,14 19,21 12,17 5,21 7,14 2,9 9,9" />
                            </svg>
                            <svg class="star" data-value="3" viewBox="0 0 24 24">
                                <polygon points="12,2 15,9 22,9 17,14 19,21 12,17 5,21 7,14 2,9 9,9" />
                            </svg>
                            <svg class="star" data-value="4" viewBox="0 0 24 24">
                                <polygon points="12,2 15,9 22,9 17,14 19,21 12,17 5,21 7,14 2,9 9,9" />
                            </svg>
                            <svg class="star" data-value="5" viewBox="0 0 24 24">
                                <polygon points="12,2 15,9 22,9 17,14 19,21 12,17 5,21 7,14 2,9 9,9" />
                            </svg>
                        </span>
                    </div>
                    <button class="review-submission-button" type="submit">Submit</button>
            </div>
            </form>
            </div>
        </section>  
    </main>
    <footer>
        <p>© 2025 HBnB, Ashe2002. All rights reserved.</p>
    </footer>
    <script src="scripts.js"></script>
</body>

</html>
